<div class="overlay">
    <div class="modal">
      <h2 class="modal-title">Create New Timer</h2>
      <form class="modal-form">
        <label for="timer-name">Timer Name</label>
        <input
          type="text"
          id="timer-name"
          name="timer-name"
          placeholder="e.g., Pasta, Chicken, Cake..."
        />

        <label for="duration">Duration (minutes)</label>
        <input
          type="number"
          id="duration"
          name="duration"
          value="10"
          min="1"
        />

        <button type="submit" class="create-btn">Create Timer</button>
      </form>
    </div>
</div>
